name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (8 and 17 for the build's tools, 21 runs Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21

      - name: Cache Gradle and decompiled Minecraft
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'buildscript.properties', 'dependencies.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          # each javac error as an annotation on the run page (file, line and message)
          grep -E '\.java:[0-9]+: error:' build.log | head -40 | while IFS= read -r l; do
            f=$(echo "$l" | sed -E 's#^.*/(src/main/java/[^:]+):([0-9]+): error: (.*)$#\1#')
            n=$(echo "$l" | sed -E 's#^.*/src/main/java/[^:]+:([0-9]+): error: (.*)$#\1#')
            m=$(echo "$l" | sed -E 's#^.*: error: (.*)$#\1#')
            echo "::error file=$f,line=$n::$m"
          done
          # and the first lines of whatever else went wrong
          grep -A12 'What went wrong' build.log | head -14 | tr '\n' ' ' | sed 's/^/::error title=Gradle::/' ; echo

      - name: Collect jar
        if: success()
        run: |
          mkdir dist
          find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} dist/ \;
          ls -la dist

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visceral-jar
          path: dist/*.jar
          if-no-files-found: error

  ingame-test:
    # Starts Minecraft with no screen (virtual display, software graphics) and runs the scripted test
    # in src/testharness: screenshots, a report and the logs come out as the "ingame-test" artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (8 and 17 for the build's tools, 21 runs Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21

      - name: Cache Gradle and decompiled Minecraft
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'buildscript.properties', 'dependencies.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-xserver-utils libgl1-mesa-dri libglu1-mesa mesa-utils > /dev/null

      - name: Run the in-game test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PvisceralTest --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64 > run.log 2>&1
          echo "exit code $?"
          grep -E '\.java:[0-9]+: error:' run.log | head -30 | sed -E 's#^.*/(src/[^:]+):([0-9]+): error: (.*)$#::error file=\1,line=\2::\3#'
          grep -h "\[autotest\]" run.log | sed 's/^.*\[autotest\] //' | head -60 | while IFS= read -r l; do echo "::notice title=autotest::$l"; done
          grep -hE "Exception|Error:|ERROR\]" run.log | grep -iv "openal\|soundsystem\|narrator\|realms\|twitch" | head -15 | while IFS= read -r l; do echo "::warning title=log::$l"; done
          exit 0

      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp -r run/visceral-test results/ 2>/dev/null || true
          cp run/logs/latest.log results/ 2>/dev/null || true
          cp -r run/crash-reports results/ 2>/dev/null || true
          cp run.log results/ 2>/dev/null || true
          # screenshots as smaller JPEGs, so they can live on a branch
          if [ -d results/visceral-test/screenshots ]; then
            for f in results/visceral-test/screenshots/*.png; do
              convert "$f" -resize 960x540 -quality 82 "${f%.png}.jpg" && rm "$f"
            done
          fi
          ls -R results | head -80

      - name: Publish results to the test-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results
          git init -q
          git checkout -q -b test-results
          echo "Results of the in-game test for ${GITHUB_SHA}" > README.md
          git add -A
          git -c user.name="visceral-ci" -c user.email="visceral-ci@users.noreply.github.com" commit -q -m "In-game test results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingame-test
          path: results/
